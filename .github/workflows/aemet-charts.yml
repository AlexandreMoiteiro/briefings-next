name: AEMET aviation charts

on:
  push:
    branches:
      - preview/meteorology-current-app
    paths:
      - ".github/workflows/aemet-charts.yml"
      - "scripts/aemet-collector.py"
      - "tests/test_aemet_collector.py"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Test chart filename and time calculation
        run: python3 -m unittest discover -s tests -p 'test_aemet_collector.py' -v

  network:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test direct official AEMET PNG over IPv4 and IPv6
        shell: bash
        run: |
          getent ahostsv4 ama.aemet.es || true
          getent ahostsv6 ama.aemet.es || true
          for ip in 4 6; do
            echo "Testing IPv$ip"
            curl -"$ip" -sS -L --max-time 10 --connect-timeout 5 \
              -o /tmp/aemet-probe.png \
              -w "HTTP=%{http_code} remote=%{remote_ip} content_type=%{content_type} size=%{size_download}\n" \
              'https://ama.aemet.es/o/estaticos/bbdd/imagenes/QGQE70LEMM1200________20261014.png' || true
          done

  collect:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/aemet-collector.py --kind all
