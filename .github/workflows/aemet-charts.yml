name: AEMET aviation charts

on:
  push:
    branches:
      - preview/meteorology-current-app
    paths:
      - "scripts/aemet-collector.py"
      - "tests/test_aemet_collector.py"
      - ".github/workflows/aemet-charts.yml"
  workflow_dispatch:
    inputs:
      kind:
        description: "Charts to collect"
        required: true
        type: choice
        options:
          - all
          - sigwx
          - wind-temp
        default: all

permissions:
  contents: read
  id-token: write

concurrency:
  group: aemet-aviation-charts
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate timestamp and AEMET filename rules
        run: python3 -m unittest discover -s tests -p 'test_aemet_collector.py' -v

  collect:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Fetch AEMET PNGs and send to Supabase using GitHub OIDC
        run: python3 scripts/aemet-collector.py --kind "${{ inputs.kind || 'all' }}"
